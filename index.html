<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PhishGuard — Phishing Website Detection System</title>
<style>
  :root {
    --bg: #0b0f14;
    --panel: #111823;
    --border: #1e2a38;
    --text: #dbe6f0;
    --muted: #6b8299;
    --safe: #33d17a;
    --danger: #ff5c5c;
    --accent: #2dd4bf;
    --mono: 'JetBrains Mono', 'Courier New', monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    background-image:
      linear-gradient(rgba(45,212,191,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(45,212,191,0.03) 1px, transparent 1px);
    background-size: 28px 28px;
    color: var(--text);
    font-family: 'Segoe UI', system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 6px;
  }
  .brand-mark {
    width: 34px; height: 34px;
    border-radius: 8px;
    background: linear-gradient(135deg, var(--accent), #0ea5a0);
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; color: #06231f; font-size: 16px;
  }
  h1 {
    font-size: 22px;
    letter-spacing: 0.5px;
    margin: 0;
  }
  .tagline {
    color: var(--muted);
    font-size: 13px;
    font-family: var(--mono);
    margin-bottom: 36px;
  }
  .panel {
    width: 100%;
    max-width: 640px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 28px;
  }
  label {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--muted);
    font-family: var(--mono);
  }
  .input-row {
    display: flex;
    gap: 10px;
    margin-top: 10px;
  }
  input[type="text"] {
    flex: 1;
    background: #0d141c;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
    color: var(--text);
    font-family: var(--mono);
    font-size: 14px;
    outline: none;
  }
  input[type="text"]:focus {
    border-color: var(--accent);
  }
  button {
    background: var(--accent);
    color: #06231f;
    border: none;
    border-radius: 8px;
    padding: 0 22px;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
  }
  button:hover { background: #5eead4; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }

  .result {
    margin-top: 24px;
    display: none;
  }
  .result.show { display: block; animation: fadeIn 0.25s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px);} to {opacity:1; transform:none;} }

  .verdict {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 18px;
    border-radius: 10px;
    border: 1px solid var(--border);
  }
  .verdict.safe { border-color: rgba(51,209,122,0.4); background: rgba(51,209,122,0.06); }
  .verdict.danger { border-color: rgba(255,92,92,0.4); background: rgba(255,92,92,0.06); }

  .dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
  .dot.safe { background: var(--safe); box-shadow: 0 0 10px var(--safe); }
  .dot.danger { background: var(--danger); box-shadow: 0 0 10px var(--danger); }

  .verdict-text { font-family: var(--mono); font-size: 15px; font-weight: 700; }
  .verdict-text.safe { color: var(--safe); }
  .verdict-text.danger { color: var(--danger); }
  .confidence { color: var(--muted); font-size: 12px; margin-top: 3px; font-family: var(--mono); }

  .features {
    margin-top: 18px;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
  }
  .features summary { cursor: pointer; color: var(--accent); margin-bottom: 8px; }
  .feature-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 4px 20px;
  }
  .feature-grid div { display: flex; justify-content: space-between; padding: 3px 0; border-bottom: 1px dashed var(--border); }
  .feature-grid span:last-child { color: var(--text); }

  .error-msg { color: var(--danger); font-family: var(--mono); font-size: 13px; margin-top: 12px; }

  footer {
    margin-top: 28px;
    color: var(--muted);
    font-size: 12px;
    font-family: var(--mono);
    text-align: center;
  }
</style>
</head>
<body>

  <div class="brand">
    <div class="brand-mark">P</div>
    <h1>PhishGuard</h1>
  </div>
  <div class="tagline">// ML-based phishing website detection system</div>

  <div class="panel">
    <label for="urlInput">Enter URL to analyze</label>
    <div class="input-row">
      <input type="text" id="urlInput" placeholder="https://example.com/login" autocomplete="off">
      <button id="checkBtn" onclick="checkUrl()">Scan</button>
    </div>
    <div id="errorMsg" class="error-msg"></div>

    <div id="result" class="result">
      <div id="verdictBox" class="verdict">
        <div id="dot" class="dot"></div>
        <div>
          <div id="verdictText" class="verdict-text"></div>
          <div id="confidenceText" class="confidence"></div>
        </div>
      </div>

      <details class="features">
        <summary>View extracted features</summary>
        <div id="featureGrid" class="feature-grid"></div>
      </details>
    </div>
  </div>

  <footer>Model: Random Forest Classifier · 20+ URL-based features · trained offline</footer>

<script>
async function checkUrl() {
  const input = document.getElementById('urlInput');
  const url = input.value.trim();
  const errorMsg = document.getElementById('errorMsg');
  const result = document.getElementById('result');
  const btn = document.getElementById('checkBtn');

  errorMsg.textContent = '';
  result.classList.remove('show');

  if (!url) {
    errorMsg.textContent = 'Please enter a URL first.';
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Scanning...';

  try {
    const res = await fetch('/predict', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ url })
    });
    const data = await res.json();

    if (!res.ok) {
      errorMsg.textContent = data.error || 'Something went wrong.';
      return;
    }

    const verdictBox = document.getElementById('verdictBox');
    const dot = document.getElementById('dot');
    const verdictText = document.getElementById('verdictText');
    const confidenceText = document.getElementById('confidenceText');

    if (data.is_phishing) {
      verdictBox.className = 'verdict danger';
      dot.className = 'dot danger';
      verdictText.className = 'verdict-text danger';
      verdictText.textContent = '⚠ PHISHING DETECTED';
    } else {
      verdictBox.className = 'verdict safe';
      dot.className = 'dot safe';
      verdictText.className = 'verdict-text safe';
      verdictText.textContent = '✓ LEGITIMATE';
    }
    confidenceText.textContent = `Confidence: ${data.confidence}%`;

    const grid = document.getElementById('featureGrid');
    grid.innerHTML = '';
    for (const [key, val] of Object.entries(data.features)) {
      const row = document.createElement('div');
      row.innerHTML = `<span>${key}</span><span>${val}</span>`;
      grid.appendChild(row);
    }

    result.classList.add('show');
  } catch (e) {
    errorMsg.textContent = 'Could not reach the server.';
  } finally {
    btn.disabled = false;
    btn.textContent = 'Scan';
  }
}

document.getElementById('urlInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') checkUrl();
});
</script>
</body>
</html>
